<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="Umrah and holiday packages">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#0c1929"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#pbg)"/>
  <circle cx="300" cy="200" r="100" fill="#a78bfa" opacity="0.2"/>
  <circle cx="1600" cy="300" r="180" fill="#818cf8" opacity="0.15"/>
  <!-- mosque dome silhouette -->
  <g transform="translate(760 380)" fill="#1e1b4b" opacity="0.9">
    <rect x="120" y="200" width="160" height="180" rx="4"/>
    <path d="M200 40 Q200 120 120 200 Q200 160 280 200 Q200 120 200 40"/>
    <ellipse cx="200" cy="200" rx="100" ry="30"/>
    <rect x="60" y="280" width="40" height="100" rx="2"/>
    <rect x="300" y="280" width="40" height="100" rx="2"/>
    <circle cx="80" cy="260" r="28"/>
    <circle cx="320" cy="260" r="28"/>
  </g>
  <!-- palm trees -->
  <g fill="#065f46" opacity="0.8">
    <rect x="380" y="520" width="16" height="140" rx="4"/>
    <path d="M388 520 Q340 460 300 500 Q360 480 388 520 Q416 480 476 500 Q436 460 388 520"/>
    <rect x="1320" y="480" width="18" height="180" rx="4"/>
    <path d="M1329 480 Q1270 400 1210 450 Q1280 420 1329 480 Q1378 420 1448 450 Q1388 400 1329 480"/>
  </g>
  <!-- offer tag -->
  <rect x="120" y="120" width="320" height="64" rx="32" fill="url(#gold)" opacity="0.95"/>
  <text x="280" y="162" text-anchor="middle" fill="#78350f" font-family="system-ui,sans-serif" font-size="26" font-weight="700">SEASONAL OFFERS</text>
  <text x="960" y="980" text-anchor="middle" fill="#a5b4fc" font-family="system-ui,sans-serif" font-size="22">Umrah · Dubai · Southeast Asia</text>
</svg>
