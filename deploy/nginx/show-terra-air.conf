# Show Terra Air — Nginx configuration
# Domains: showterraair.com, admin.showterraair.com, api.showterraair.com
#
# Install:
#   sudo cp deploy/nginx/show-terra-air.conf /etc/nginx/sites-available/show-terra-air.conf
#   sudo ln -sf /etc/nginx/sites-available/show-terra-air.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# SSL (after DNS points to VPS):
#   sudo certbot --nginx -d showterraair.com -d www.showterraair.com \
#     -d admin.showterraair.com -d api.showterraair.com
#
# Assumptions:
#   - App root: /var/www/showterraflight
#   - Backend listens on 127.0.0.1:5000 (PM2)
#   - Public/admin SPAs proxy /api and /uploads to backend (same-origin cookies)

# Rate limit zone for login/API abuse (optional — tune as needed)
limit_req_zone $binary_remote_addr zone=sta_api_limit:10m rate=30r/s;

# Upstream backend
upstream sta_backend {
    server 127.0.0.1:5000;
    keepalive 32;
}

# --- HTTP → HTTPS redirect (all domains) ---
server {
    listen 80;
    listen [::]:80;
    server_name showterraair.com www.showterraair.com admin.showterraair.com api.showterraair.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Public website: showterraair.com + www ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name showterraair.com www.showterraair.com;

    # Certbot will inject ssl_certificate paths; placeholders for first nginx -t before certbot:
    ssl_certificate     /etc/letsencrypt/live/showterraair.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/showterraair.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/showterraflight/frontend-public/dist;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    client_max_body_size 12M;

    # Redirect www → apex (optional; remove if you prefer www as canonical)
    if ($host = www.showterraair.com) {
        return 301 https://showterraair.com$request_uri;
    }

    location /api/ {
        limit_req zone=sta_api_limit burst=50 nodelay;
        proxy_pass http://sta_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /uploads/ {
        proxy_pass http://sta_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}

# --- Admin panel: admin.showterraair.com ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.showterraair.com;

    ssl_certificate     /etc/letsencrypt/live/showterraair.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/showterraair.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/showterraflight/frontend-admin/dist;
    index index.html;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    client_max_body_size 12M;

    location /api/ {
        limit_req zone=sta_api_limit burst=50 nodelay;
        proxy_pass http://sta_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /uploads/ {
        proxy_pass http://sta_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}

# --- API subdomain: api.showterraair.com (direct backend access) ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.showterraair.com;

    ssl_certificate     /etc/letsencrypt/live/showterraair.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/showterraair.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    client_max_body_size 12M;

    location / {
        limit_req zone=sta_api_limit burst=50 nodelay;
        proxy_pass http://sta_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
