# Show Terra Flight — production nginx (showterraflight.com)
# App root: /var/www/showterraflight
#
# Install (ONLY this site — do not enable show-terra-air.conf):
#   sudo cp deploy/nginx/showterraflight.com.conf /etc/nginx/sites-available/showterraflight.com
#   sudo ln -sf /etc/nginx/sites-available/showterraflight.com /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/show-terra-air.conf
#   sudo nginx -t && sudo systemctl reload nginx

upstream sta_backend {
    server 127.0.0.1:5000;
    keepalive 32;
}

# --- Public website ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name showterraflight.com www.showterraflight.com;

    # After certbot: sudo certbot certificates — use the active certificate name
    ssl_certificate     /etc/letsencrypt/live/showterraflight.com-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/showterraflight.com-0001/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/showterraflight/frontend-public/dist;
    index index.html;

    client_max_body_size 12M;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    location /api/ {
        proxy_pass http://sta_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://sta_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /images/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# --- Admin panel (adjust server_name if you use admin.showterraflight.com) ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.showterraflight.com;

    ssl_certificate     /etc/letsencrypt/live/showterraflight.com-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/showterraflight.com-0001/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/showterraflight/frontend-admin/dist;
    index index.html;

    client_max_body_size 12M;

    location /api/ {
        proxy_pass http://sta_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://sta_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# --- HTTP redirect ---
server {
    listen 80;
    listen [::]:80;
    server_name showterraflight.com www.showterraflight.com admin.showterraflight.com;
    return 301 https://$host$request_uri;
}
